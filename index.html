<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Projeto 30 Dias – Meu Bem-Estar</title><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#2c3226;--mu:#7b8270;--ol:#6b7a3a;--sg:#a9b88f;--ln:#e8e4d8;--sf:#eef1e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1f17;--card:#262a1f;--tx:#eee9dc;--mu:#a2a893;--ol:#b4c37f;--sg:#6f7d52;--ln:#38402e;--sf:#2f3526}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;padding-bottom:84px}
#app{max-width:720px;margin:auto;padding:16px}h1{font-size:24px;margin:8px 0 2px;font-weight:600}h2{font-size:16px;margin:0 0 10px}.mu{color:var(--mu);font-size:13px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .c{margin:0}.big{font-size:22px;font-weight:600;color:var(--ol)}
.bar{height:8px;background:var(--sf);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ol);border-radius:9px}
button,select,input,textarea{font:inherit;color:var(--tx)}button{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;cursor:pointer}button.p{background:var(--ol);color:#fff;border:0}button.x{padding:2px 8px;color:var(--mu)}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;width:100%;min-width:0}input[type=checkbox]{width:auto}input[type=range]{padding:0;accent-color:var(--ol)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.row>*{flex:1}.row>button{flex:0 0 auto}.dn{display:flex;justify-content:space-between;align-items:center}.dn button{padding:6px 14px}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer}.ck:last-child{border:0}.ck input{accent-color:var(--ol);width:20px;height:20px}
.li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:110px;border:0;background:none;font-size:11px;padding:4px 2px;color:var(--mu)}nav button b{display:block;font-size:19px;font-weight:400}nav button.on{color:var(--ol);font-weight:600}
#tm{position:fixed;right:12px;bottom:78px;background:var(--ol);color:#fff;border-radius:20px;padding:8px 14px;display:none;z-index:5}
.note{background:var(--sf);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--mu);margin:8px 0}
</style></head><body><div id="app"></div><div id="tm"></div><nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),T=iso(new Date());
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return iso(x)},dif=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const last=n=>[...Array(n)].map((_,i)=>addD(T,i-n+1)),num=v=>parseFloat(String(v).replace(',','.'))||0,wdN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const H=['Bebi água suficiente','Consumi proteínas nas refeições','Comi frutas','Consumi legumes e verduras conforme minha tolerância','Evitei exageros de ultraprocessados','Comi devagar e mastiguei bem','Fiz atividade física ou caminhada planejada','Registrei meu nível de estufamento','Cuidei da minha rotina de sono'];
const MS=['Café da manhã','Lanche da manhã','Almoço','Lanche da tarde','Jantar','Ceia'],K='p30';
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S.start??=T;S.days??={};S.g??={w:2000,p:100};S.m??=[{d:T,peso:60.6}];S.wk??={};S.walk??=[];S.fav??=[];
S.plan??={1:['Inferiores A','Agachamento','Leg press','Cadeira extensora','Elevação pélvica'],2:['Superiores A','Puxada','Supino','Desenvolvimento','Rosca direta','Abdominal'],3:['Caminhada'],4:['Inferiores B','Stiff','Mesa flexora','Avanço','Glúteo no cabo'],5:['Superiores B','Remada','Elevação lateral','Tríceps','Rosca martelo','Prancha'],0:['Descanso / atividade leve'],6:['Descanso / atividade leve']};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='home',cur=T;const D=d=>S.days[d]??={chk:[],w:0,meals:[],sym:{}};
const tot=(d,k)=>(S.days[d]?.meals||[]).reduce((a,m)=>a+m[k],0),mL=k=>[...S.m].filter(x=>x[k]).sort((x,y)=>x.d<y.d?-1:1).at(-1)?.[k];
const trained=d=>Object.values(S.wk[d]?.s||{}).some(a=>a.length),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,f1=v=>v==null?'–':(+v).toFixed(1);
const fmt=d=>{const x=new Date(d+'T12:00');return wdN[x.getDay()]+', '+d.split('-').reverse().slice(0,2).join('/')};
const go=n=>{cur=addD(cur,n);if(cur>T)cur=T;R()},dnav=()=>`<div class=dn><button onclick="go(-1)">‹</button><b>${cur===T?'Hoje · ':''}${fmt(cur)}</b><button onclick="go(1)">›</button></div>`;
const bar=(v,m)=>`<div class=bar><i style="width:${Math.min(100,m?v/m*100:0)}%"></i></div>`,st=(l,v,s='')=>`<div class=c><div class=mu>${l}</div><div class=big>${v}</div>${s}</div>`;
function line(a,u=''){a=a.filter(p=>p.y!=null);if(a.length<2)return'<p class=mu>Registre ao menos 2 pontos para ver o gráfico.</p>';const ys=a.map(p=>p.y),mn=Math.min(...ys),r=Math.max(...ys)-mn||1,P=a.map((p,i)=>[10+i*280/(a.length-1),88-(p.y-mn)/r*66]);
return`<svg viewBox="0 0 300 110" width="100%"><path d="${P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('')}" fill="none" stroke="var(--ol)" stroke-width="2"/>${P.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--ol)"><title>${a[i].x}: ${a[i].y}${u}</title></circle>`).join('')}<text x="10" y="106" font-size="9" fill="var(--mu)">${a[0].x.slice(5)}</text><text x="290" y="106" font-size="9" text-anchor="end" fill="var(--mu)">${a.at(-1).x.slice(5)} · ${a.at(-1).y}${u}</text></svg>`}
const msg=m=>{const e=document.createElement('div');e.textContent=m;e.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:30;max-width:90%';document.body.append(e);setTimeout(()=>e.remove(),2500)};
function ask(l,d,cb,ta){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px';o.innerHTML=`<div class=c style="width:100%;max-width:420px"><b>${esc(l)}</b><div style="height:8px"></div>${ta?'<textarea rows=6 id=aq></textarea>':'<input id=aq>'}<div class=row><button id=ac>Cancelar</button><button class=p id=ak>OK</button></div></div>`;document.body.append(o);const i=o.querySelector('#aq');i.value=d??'';i.focus();o.querySelector('#ac').onclick=()=>o.remove();o.querySelector('#ak').onclick=()=>{const v=i.value;o.remove();cb(v)}}
const V={};
V.home=()=>{const n=Math.min(30,Math.max(1,dif(S.start,T)+1)),p=Math.round(n/30*100),d=D(T),h=new Date().getHours(),ab=last(7).map(x=>S.days[x]?.sym?.ab).filter(x=>x!=null);
return`<h1>${h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}, Naiara 🌿</h1><p class=mu>${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
<div class=c><b>Dia ${n} de 30</b> <span class=mu>· ${p}% do projeto</span>${bar(p,100)}</div>
<div class=g2>${st('Peso atual',mL('peso')?mL('peso')+' kg':'–')}${st('Cintura',mL('cint')?mL('cint')+' cm':'–')}
${st('Água hoje',d.w+' ml',bar(d.w,S.g.w))}${st('Proteína hoje',Math.round(tot(T,'p'))+' g',bar(tot(T,'p'),S.g.p))}
${st('Treinos (7 dias)',last(7).filter(trained).length+' / 4')}${st('Inchaço abd. (7d)',f1(avg(ab)),'<div class=mu>média 0–10</div>')}</div>
<div class=c><h2>Hábitos de hoje · ${d.chk.length}/${H.length}</h2>${bar(d.chk.length,H.length)}${H.map((t,i)=>`<label class=ck><input type=checkbox ${d.chk.includes(i)?'checked':''} onchange="tg(${i},'${T}')">${t}</label>`).join('')}</div>
<div class=c><h2>Evolução do peso</h2>${line([...S.m].filter(x=>x.peso).sort((a,b)=>a.d<b.d?-1:1).map(x=>({x:x.d,y:x.peso})),' kg')}<div class=note>Pequenas oscilações de peso são normais e não indicam ganho ou perda definitiva de gordura.</div></div>
<div class=c><h2>Inchaço abdominal (últimos 14 dias)</h2>${line(last(14).map(x=>({x,y:S.days[x]?.sym?.ab})))}</div>`};
const tg=(i,d)=>{const c=D(d).chk,k=c.indexOf(i);k<0?c.push(i):c.splice(k,1);sv();R()};
V.hoje=()=>{const d=D(cur),m=d.meals,k=tot(cur,'k');
return`${dnav()}<div class=c><h2>Checklist · ${d.chk.length}/${H.length}</h2>${H.map((t,i)=>`<label class=ck><input type=checkbox ${d.chk.includes(i)?'checked':''} onchange="tg(${i},'${cur}')">${t}</label>`).join('')}<p class=mu>Reinicia sozinho a cada dia; o histórico fica salvo.</p></div>
<div class=c><h2>Água · ${d.w} / ${S.g.w} ml</h2>${bar(d.w,S.g.w)}<div class=row><button onclick="aw(200)">+200</button><button onclick="aw(300)">+300</button><button onclick="aw(500)">+500</button><button onclick="aw(-200)">−200</button><button onclick="eg('w')">Meta</button></div></div>
<div class=c><h2>Macros do dia</h2><div class=mu>Calorias: <b>${Math.round(k)} kcal</b> (meta definida com orientação profissional)</div><div class=mu>Proteína: ${Math.round(tot(cur,'p'))} / ${S.g.p} g <button class=x onclick="eg('p')">editar meta</button></div>${bar(tot(cur,'p'),S.g.p)}<div class=mu>Carboidratos ${Math.round(tot(cur,'c'))} g · Gorduras ${Math.round(tot(cur,'f'))} g</div></div>
<div class=c><h2>Refeições</h2>${MS.map(s=>{const l=m.map((x,i)=>[x,i]).filter(([x])=>x.meal===s);return l.length?`<b>${s}</b>${l.map(([x,i])=>`<div class=li><span>${esc(x.n)} <span class=mu>${esc(x.q)} · ${x.k} kcal · P${x.p} C${x.c} G${x.f}</span></span><span><button class=x onclick="em(${i})">✎</button><button class=x onclick="dm(${i})">✕</button></span></div>`).join('')}`:''}).join('')||'<p class=mu>Nenhum alimento registrado neste dia.</p>'}</div>
<div class=c><h2>Adicionar alimento</h2><select id=mm>${MS.map(s=>`<option>${s}</option>`).join('')}</select><div class=row><input id=fn placeholder="Alimento"><input id=fq placeholder="Qtd (g/un)"></div><div class=row><input id=fk type=number placeholder="kcal"><input id=fp type=number placeholder="Prot g"><input id=fc type=number placeholder="Carb g"><input id=ff type=number placeholder="Gord g"></div><div class=row><button class=p onclick="am(0)">Adicionar</button><button onclick="am(1)">★ Adicionar e favoritar</button></div>
${S.fav.length?`<div class=row><select id=fv>${S.fav.map((x,i)=>`<option value=${i}>${esc(x.n)} (${esc(x.q)})</option>`).join('')}</select><button onclick="af()">Usar favorito</button><button class=x onclick="S.fav.splice(+$('#fv').value,1);sv();R()">apagar</button></div>`:''}</div>`};
const aw=v=>{const d=D(cur);d.w=Math.max(0,d.w+v);sv();R()},eg=k=>ask(k==='w'?'Meta de água (ml):':'Meta de proteína (g):',S.g[k],v=>{if(num(v)>0){S.g[k]=num(v);sv();R()}});
const gm=()=>({meal:$('#mm').value,n:$('#fn').value.trim(),q:$('#fq').value.trim(),k:num($('#fk').value),p:num($('#fp').value),c:num($('#fc').value),f:num($('#ff').value)});
const am=fv=>{const x=gm();if(!x.n)return msg('Informe o alimento');D(cur).meals.push(x);if(fv)S.fav.push({...x});sv();R()},af=()=>{D(cur).meals.push({...S.fav[+$('#fv').value],meal:$('#mm').value});sv();R()};
const dm=i=>{D(cur).meals.splice(i,1);sv();R()},em=i=>{const x=D(cur).meals[i];ask('nome;quantidade;kcal;prot;carb;gord',[x.n,x.q,x.k,x.p,x.c,x.f].join(';'),v=>{const a=v.split(';');Object.assign(x,{n:a[0],q:a[1]||'',k:num(a[2]),p:num(a[3]),c:num(a[4]),f:num(a[5])});sv();R()})};
const sy=(k,v)=>{D(cur).sym[k]=v;sv()};
V.sint=()=>{const s=D(cur).sym,rg=(k,l)=>`<label class=mu>${l}</label><div class=row><input type=range min=0 max=10 value=${s[k]??0} oninput="this.nextElementSibling.textContent=this.value" onchange="sy('${k}',+this.value)"><b style="flex:0 0 24px">${s[k]??0}</b></div>`,cb=(k,l)=>`<label class=ck><input type=checkbox ${s[k]?'checked':''} onchange="sy('${k}',this.checked)">${l}</label>`;
const bad=Object.keys(S.days).filter(x=>(S.days[x].sym?.ab??0)>=6).sort().reverse().slice(0,6);
return`${dnav()}<div class=c><h2>Como estou hoje</h2>${rg('ab','Inchaço abdominal (0–10)')}${rg('fa','Inchaço facial (0–10)')}${rg('ga','Intensidade dos gases (0–10)')}${rg('dor','Dor abdominal (0–10)')}${cb('es','Sensação de barriga estufada')}${cb('ev','Evacuação hoje')}${cb('mn','Período menstrual')}
<label class=mu>Consistência das fezes</label><select onchange="sy('cs',this.value)">${['','Ressecadas','Normais','Amolecidas','Líquidas'].map(o=>`<option ${s.cs===o?'selected':''}>${o}</option>`).join('')}</select>
<label class=mu>Observações sobre alimentos</label><textarea rows=3 onchange="sy('ob',this.value)">${esc(s.ob||'')}</textarea><p class=mu>Salvo automaticamente.</p></div>
<div class=c><h2>Dias com mais sintomas</h2>${bad.length?bad.map(x=>`<div class=li><span><b>${fmt(x)}</b> · inchaço ${S.days[x].sym.ab}<br><span class=mu>Alimentos registrados: ${esc([...new Set(S.days[x].meals.map(m=>m.n))].join(', ')||'–')}${S.days[x].sym.ob?'<br>Obs.: '+esc(S.days[x].sym.ob):''}</span></span></div>`).join(''):'<p class=mu>Nenhum dia com inchaço ≥ 6 ainda.</p>'}<div class=note>Aqui aparecem apenas associações observadas no seu diário. Elas não indicam causa nem intolerância — leve ao seu profissional de saúde.</div></div>
<div class=c><h2>Tendência (30 dias)</h2>${line(last(30).map(x=>({x,y:S.days[x]?.sym?.ab})))}</div>`};
let tI,tE=0;function rest(s){clearInterval(tI);tE=Date.now()+s*1e3;const e=$('#tm');e.style.display='block';const t=()=>{const r=Math.ceil((tE-Date.now())/1e3);if(r<=0){clearInterval(tI);e.innerHTML='✓ Descanso concluído <button class=x style="color:#fff" onclick="this.parentNode.style.display=\'none\'">✕</button>';navigator.vibrate&&navigator.vibrate([200,100,200]);return}e.textContent='⏱ '+Math.floor(r/60)+':'+String(r%60).padStart(2,'0')};t();tI=setInterval(t,250)}
const wd=()=>S.wk[cur]?.t??null,W=()=>S.wk[cur]??={s:{},x:[]};
const prev=n=>{for(const d of Object.keys(S.wk).sort().reverse())if(d<cur&&S.wk[d].s[n]?.length){const a=S.wk[d].s[n].at(-1);return a.kg+' kg × '+a.r+' ('+d.slice(5)+')'}return'–'};
V.treino=()=>{const p=wd()==null?['Treino livre']:S.plan[wd()],w=S.wk[cur],ex=exs(),ws=S.walk.map((x,i)=>[x,i]).filter(([x])=>x.d>=addD(T,-27)).sort((a,b)=>a[0].d<b[0].d?1:-1);const wkm=ws.filter(([x])=>x[0]>=addD(T,-6));
return`${dnav()}<div class=c><h2>${esc(p[0])}</h2><label class=mu>Qual treino você fez nesta data?</label><select onchange="W().t=this.value===''?null:+this.value;sv();R()"><option value="">Escolha o treino…</option>${[1,2,3,4,5,0].map(k=>`<option value=${k} ${k===wd()?'selected':''}>${esc(S.plan[k][0])}</option>`).join('')}</select>${p.length>1||w?.x?.length?'':'<p class=mu>Escolha acima o treino que você fez ou adicione exercícios extras.</p>'}<button onclick="ep()">Editar divisão deste dia</button><div class=row><input id=nx placeholder="Novo exercício (ex.: Crucifixo)"><button class=p onclick="ae()">+ Adicionar</button></div><div class=row><span class=mu style="flex:0 0 auto">Descanso:</span><button onclick="rest(60)">60s</button><button onclick="rest(90)">90s</button><button onclick="rest(120)">2min</button><button onclick="rest(180)">3min</button></div></div>
${ex.map((n,i)=>{const a=w?.s[n]||[];return`<div class=c><b>${esc(n)}</b> <span class=mu>última: ${prev(n)}</span><button class=x onclick="rn(${i})">✎ trocar</button><button class=x onclick="rx(${i})">remover</button>${a.map((x,j)=>`<div class=li><span>Série ${j+1}: <b>${x.kg} kg × ${x.r}</b></span><span><button class=x onclick="es(${i},${j})">✎</button><button class=x onclick="ds(${i},${j})">✕</button></span></div>`).join('')}<div class=row><input id=k${i} type=number placeholder="kg"><input id=r${i} type=number placeholder="reps"><button class=p onclick="as(${i})">+ série</button></div></div>`}).join('')}
<div class=c><h2>Caminhadas e atividades</h2><div class=row><input id=wm type=number placeholder="min"><input id=wk type=number placeholder="km"><input id=wp type=number placeholder="passos"><button class=p onclick="aW()">Salvar</button></div>
<p class=mu>Últimos 7 dias: ${wkm.reduce((a,[x])=>a+x.m,0)} min · ${wkm.reduce((a,[x])=>a+x.km,0).toFixed(1)} km · ${wkm.reduce((a,[x])=>a+x.st,0)} passos</p>${ws.map(([x,i])=>`<div class=li><span>${x.d.slice(5)} · ${x.m} min · ${x.km} km · ${x.st} passos<br><span class=mu>ritmo ${x.km?(x.m/x.km).toFixed(1):'–'} min/km · ~${Math.round(x.m*4)} kcal (estimativa)</span></span><button class=x onclick="S.walk.splice(${i},1);sv();R()">✕</button></div>`).join('')||'<p class=mu>Sem registros nos últimos 30 dias.</p>'}</div>`};
const bs=()=>wd()==null?[]:S.plan[wd()].slice(1).filter(n=>!(S.wk[cur]?.h||[]).includes(n)),exs=()=>[...bs(),...(S.wk[cur]?.x||[])];
const as=i=>{const n=exs()[i],kg=num($('#k'+i).value),r=num($('#r'+i).value);if(!r)return msg('Informe as repetições');(W().s[n]??=[]).push({kg,r});sv();R();rest(90)};
